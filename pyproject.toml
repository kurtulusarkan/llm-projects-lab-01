[project]
name = "lab-01"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kurtulus Arkan", email = "kurtulusarkan@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.45.0",
    "datasets>=5.0.1,<6",
    "peft>=0.15.0",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=4.57.6",
    "trl>=0.15.0",
]

[project.scripts]
lab-01 = "lab_01.benchmark:main_generation"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
