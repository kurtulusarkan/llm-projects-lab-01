name: sst2-qwen3-5000

model:
  name: Qwen/Qwen3-0.6B

dataset:
  name: SST-2
  train_size: 5000
  seed: 42

training:
  epochs: 3
  learning_rate: 0.0002
  batch_size: 8
  gradient_accumulation_steps: 1
  gradient_checkpointing: false

lora:
  rank: 8
  alpha: 16
  dropout: 0.05

output:
  root: outputs/experiments
  evaluation_batch_size: 32
